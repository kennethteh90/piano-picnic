name: Sync dependency lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/deps-modernize-6389
    paths:
      - .github/workflows/sync-dependency-lockfile.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/deps-modernize-6389

      - name: Copy package manifests from validated mirror
        run: |
          git clone --depth 1 --branch cursor/deps-modernize-6389 \
            https://origin.cursor.com/git/kennethteh/tmp-275be7eb62cddb90 /tmp/deps-mirror
          cp /tmp/deps-mirror/package.json package.json
          cp /tmp/deps-mirror/package-lock.json package-lock.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --staged --quiet; then
            echo "No manifest changes to sync."
            exit 0
          fi
          git commit -m "chore(deps): React 19.3 and lockfile refresh"
          git push
