name: Sync dependency lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/deps-modernize-6389
    paths:
      - .github/workflows/sync-dependency-lockfile.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/deps-modernize-6389

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate package-lock.json from package.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --staged --quiet; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git commit -m "chore(deps): React 19.3 and lockfile refresh"
          git push
